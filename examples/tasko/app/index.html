<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasko</title>
<style>
  :root { --ink: #1b1b2b; --muted: #6b6b80; --line: #e6e4ef; --brand: #5b4bdb; --bg: #f7f6fb; --ok: #1f9d55; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--ink); background: var(--bg); }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { background: #fff; border-right: 1px solid var(--line); padding: 22px 16px; }
  .logo { font-weight: 700; font-size: 20px; display: flex; gap: 10px; align-items: center; margin-bottom: 28px; }
  .logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); display: inline-block; }
  nav a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; margin-bottom: 2px; }
  nav a.on { background: #efedfc; color: var(--brand); font-weight: 600; }
  main { padding: 34px 44px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 2px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
  .primary { background: var(--brand); color: #fff; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9c6da; display: grid; place-items: center; cursor: pointer; flex: none; }
  .row.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .row.done .title { color: var(--muted); text-decoration: line-through; }
  .title { flex: 1; }
  .who { font-size: 13px; color: var(--muted); }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: #fff4e5; color: #a35a00; }
  .add { display: none; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .add.open { display: flex; }
  .add input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .add input:focus { border-color: var(--brand); }
  .stats { display: flex; gap: 14px; margin-bottom: 18px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 150px; }
  .stat b { font-size: 22px; display: block; }
  .toast { position: fixed; right: 28px; bottom: 28px; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
    opacity: 0; transform: translateY(10px); transition: all .25s; }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i></i>Tasko</div>
    <nav><a class="on" href="#">Today</a><a href="#">Upcoming</a><a href="#">Team</a><a href="#">Settings</a></nav>
  </aside>
  <main>
    <header>
      <div><h1>Launch week</h1><div class="sub">Chai Time · 4 people</div></div>
      <button class="primary" id="new">New task</button>
    </header>
    <div class="stats">
      <div class="stat"><b id="open-count">0</b>open tasks</div>
      <div class="stat"><b id="done-count">0</b>done today</div>
    </div>
    <div class="card">
      <div class="add" id="add"><input id="title" placeholder="What needs doing?"><button class="primary" id="save">Add</button></div>
      <div id="list"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
  // The app loads its tasks from an API, like a real product. The video harness answers /api/tasks with demo data.
  const list = document.getElementById('list');
  let tasks = [];
  const render = () => {
    list.innerHTML = tasks.map((t, i) => `
      <div class="row ${t.done ? 'done' : ''}" data-i="${i}">
        <div class="check">${t.done ? '✓' : ''}</div>
        <div class="title">${t.title}</div>
        ${t.tag ? `<span class="tag">${t.tag}</span>` : ''}
        <div class="who">${t.who}</div>
      </div>`).join('');
    document.getElementById('open-count').textContent = tasks.filter((t) => !t.done).length;
    document.getElementById('done-count').textContent = tasks.filter((t) => t.done).length;
  };
  const toast = (m) => { const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); };
  fetch('/api/tasks').then((r) => r.json()).then((d) => { tasks = d.tasks; render(); });
  document.getElementById('new').onclick = () => { document.getElementById('add').classList.add('open'); document.getElementById('title').focus(); };
  const save = () => {
    const v = document.getElementById('title').value.trim();
    if (!v) return;
    tasks.unshift({ title: v, who: 'Riya', done: false, tag: 'New' });
    document.getElementById('title').value = '';
    document.getElementById('add').classList.remove('open');
    render(); toast('Task added');
  };
  document.getElementById('save').onclick = save;
  document.getElementById('title').onkeydown = (e) => { if (e.key === 'Enter') save(); };
  list.onclick = (e) => {
    const row = e.target.closest('.row'); if (!row || !e.target.closest('.check')) return;
    const t = tasks[+row.dataset.i]; t.done = !t.done; render(); if (t.done) toast('Nice, one less to do');
  };
</script>
</body>
</html>
